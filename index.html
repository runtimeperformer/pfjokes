<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>the machine knows the rules</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const colors = [
        "#B7975D",
        "#AFA7D6",
        "#CFBA28",
        "#4AD231"
      ];

      const images = [
        "EXOTIC_MANIFOLD.png",
        "IMG_5430.JPG",
        "IMG_5333.JPG",
        "IMG_6089.jpeg",
        "IMG_5296.png",
        "IMG_3831.png",
        "IMG_2816.png",
        "IMG_0489.png",
        "IMG_0046.png",
      ];

      const pic = document.getElementById("a_pic")
      let i = 0, j = 0;
      
      function cyclez_bg() {
        document.body.style.backgroundColor = colors[i];
        i = (i + 1) % colors.length;
      }

      function cyclez_img() {
        pic.src = images[j];
        j = (j + 1) % images.length;
      }
      cyclez_bg();
      cyclez_img();
      setInterval(cyclez_bg, 7000);
      setInterval(cyclez_img, 0500);
    });
  </script>
</head>

<body>
  <div class="center-wrap">
    <div class="pretti">
      <p>
        どこか別の人生で また会いましょう。<br>
        どこか別の世界で。<br>
        前世、 来世、 次の時代。<br>
        そっちで会おう。<br>
      </p>

      <a href="https://worldvolume.bandcamp.com/album/exotic-manifold" target="_blank" rel="noopener noreferrer">
        <img id="a_pic" src="EXOTIC_MANIFOLD.png" alt="" class="album" />
      </a>

      <div class="pretti tini">
        <a href="https://soundcloud.com/queenleaf" target="_blank" rel="noopener noreferrer">
          you can feel the sand between your toes, and the sun on your face
        </a>

        <a href="https://soundcloud.com/worldvolume" target="_blank" rel="noopener noreferrer">
          the smell of salt and the sound of waves
        </a>

        <a href="https://worldvolume.bandcamp.com/album/year" target="_blank" rel="noopener noreferrer">
          crashing against the shore
        </a>
      </div>
    </div>

  </div>
</body>

</html>
